name-template: 'vNext'
tag-template: 'vNext'

branches:
  - main

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

change-title-escapes: '\\<*_&'
no-changes-template: '- No changes since last release'

sort-by: merged_at
sort-direction: descending

exclude-contributors:
  - renovate[bot]

category-template: '### $TITLE'

# Inclusion, exclusion and grouping are a single ordered list in release-drafter v7.
# pre-include and pre-exclude are evaluated ahead of the changelog categories whatever
# their position here, so they are listed first to match that evaluation order.
# labels-mode is left at its default of 'any', which is the previous behaviour.
categories:
  - type: 'pre-include'
    when:
      labels:
        - breaking
        - enhancement
        - feature
        - bug
        - fix
        - perf
        - docs
        - documentation

  - type: 'pre-exclude'
    when:
      labels:
        - skip-changelog
        - renovate
        - chore
        - ci
        - build
        - test
        - refactor

  - title: '💥 Breaking Changes'
    when:
      labels:
        - breaking

  - title: '✨ Features'
    when:
      labels:
        - enhancement
        - feature

  - title: '🐛 Bug Fixes'
    when:
      labels:
        - bug
        - fix

  - title: '⚡ Performance Improvements'
    when:
      labels:
        - perf

  - title: '📚 Documentation'
    when:
      labels:
        - docs
        - documentation

include-pre-releases: false

template: |
  $CHANGES
